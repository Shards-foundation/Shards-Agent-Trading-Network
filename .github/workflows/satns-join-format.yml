name: SATNS one-time join page formatting
on:
  push:
    branches:
      - feat/satns-network-onboarding
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Shards-foundation/Shards-Agent-Trading-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/satns-network-onboarding
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format join page
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/web/app/join/page.tsx
          pnpm exec prettier --check apps/web/app/join/page.tsx
          git add apps/web/app/join/page.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(satns): format join availability'
            git push origin HEAD:refs/heads/feat/satns-network-onboarding
          fi
