name: Temporary test formatter
on:
  push:
    branches:
      - test/quality-gates-adversarial-e2e

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical Prettier formatting
        run: pnpm exec prettier --write packages/risk/test/metamorphic.test.ts packages/paper-engine/test/negative.test.ts
      - name: Commit generated formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/risk/test/metamorphic.test.ts packages/paper-engine/test/negative.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(test): apply canonical formatting to new regression suites'
            git push origin HEAD:test/quality-gates-adversarial-e2e
          fi
