name: Wallet SDK lock and formatting (temporary)

on:
  push:
    branches:
      - feat/live-venues-reown-wallet-picker

permissions:
  contents: write

concurrency:
  group: wallet-sdk-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/live-venues-reown-wallet-picker
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve exact Reown SDK and workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Enforce formatting
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/venues/hyperliquid/route.ts \
            apps/web/app/api/venues/hyperliquid/book/route.ts \
            apps/web/app/api/venues/polymarket/route.ts \
            apps/web/app/api/venues/polymarket/book/route.ts \
            apps/web/app/terminal/HyperliquidPerps.tsx \
            apps/web/app/terminal/PolymarketLive.tsx \
            apps/web/app/terminal/TradingWorkspace.tsx \
            apps/web/app/terminal/venue-live.css \
            apps/web/app/terminal/page.tsx \
            apps/web/app/wallets/WalletKit.tsx \
            apps/web/app/wallets/WalletConsole.tsx \
            apps/web/app/wallets/wallet.css \
            apps/web/package.json
      - name: Commit lockfile and formatted source
        run: |
          if git diff --quiet; then
            echo "No source or lockfile changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml apps/web
            git commit -m "chore(wallet): resolve Reown SDK lock and format venue UI"
            git pull --rebase origin feat/live-venues-reown-wallet-picker
            git push origin HEAD:feat/live-venues-reown-wallet-picker
          fi
