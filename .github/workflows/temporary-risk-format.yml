name: Temporary risk formatter

on:
  push:
    branches: [fix/phase2-conservative-paper-risk]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: trigger one-time formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format risk package
        run: pnpm exec prettier --write packages/risk/src/index.ts packages/risk/test/index.test.ts
      - name: Commit only formatted risk files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/risk/src/index.ts packages/risk/test/index.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/risk/src/index.ts packages/risk/test/index.test.ts
          git commit -m "style(risk): apply workspace Prettier formatting"
          git push origin HEAD:fix/phase2-conservative-paper-risk
