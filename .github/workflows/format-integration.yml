name: One-time integration formatting

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/social-moderation-worker
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format API source and Prisma schema
        run: |
          pnpm exec prettier --write apps/api/src/index.ts
          pnpm --filter @satn/database exec prisma format --schema prisma/schema.prisma
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/index.ts packages/database/prisma/schema.prisma
          if ! git diff --cached --quiet; then
            git commit -m "style: format API source and Prisma schema"
          fi
          rm .github/workflows/format-integration.yml
          git add .github/workflows/format-integration.yml
          git commit -m "chore: remove temporary formatting workflow"
          git push origin HEAD:integration/social-moderation-worker
