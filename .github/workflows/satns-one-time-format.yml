name: SATNS one-time deterministic format repair
on:
  push:
    branches: [feat/satns-network-onboarding]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Shards-foundation/Shards-Agent-Trading-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/satns-network-onboarding
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reformat the two residual files and confirm idempotence
        shell: bash
        run: |
          set -euo pipefail
          files=(apps/api/src/network.ts apps/api/src/onboarding.ts)
          for pass in 1 2 3; do
            pnpm exec prettier --write "${files[@]}"
            if pnpm exec prettier --check "${files[@]}"; then break; fi
          done
          pnpm exec prettier --check "${files[@]}"
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(satns): stabilize backend formatting'
            git push origin HEAD:refs/heads/feat/satns-network-onboarding
          fi
