name: SATNS one-time source formatting
on:
  push:
    branches:
      - feat/satns-network-onboarding
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Shards-foundation/Shards-Agent-Trading-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/satns-network-onboarding
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source and Prisma schema
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.mdx' '*.css' '*.scss' '*.yaml' '*.yml' '*.html' '*.vue' '*.graphql' '*.toml' | grep -v '^pnpm-lock.yaml$' | while IFS= read -r path; do
            [[ -f "$path" ]] && printf '%s\n' "$path"
          done)
          if ((${#files[@]} > 0)); then
            pnpm exec prettier --write "${files[@]}"
            git add -- "${files[@]}"
          fi
          pnpm --filter @satn/database exec prisma format --schema prisma/schema.prisma
          git add packages/database/prisma/schema.prisma
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(satns): apply repository Prettier and Prisma formatting'
            git push origin HEAD:refs/heads/feat/satns-network-onboarding
          fi
