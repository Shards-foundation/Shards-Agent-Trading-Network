name: EVM wallet proof dependency and formatting preparation

on:
  push:
    branches:
      - feat/live-venues-reown-wallet-picker

permissions:
  contents: write

concurrency:
  group: satn-evm-proof-format
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/live-venues-reown-wallet-picker
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve direct API viem dependency
        run: pnpm install --no-frozen-lockfile
      - name: Format reviewed EVM feature paths
        run: |
          pnpm exec prettier --write \
            apps/api/package.json \
            apps/api/src/wallet-evm.ts \
            apps/api/src/wallet-evm.test.ts \
            apps/api/src/wallet-evm.integration.test.ts \
            apps/api/src/wallets.ts \
            apps/web/app/wallets/WalletKit.tsx \
            apps/web/app/wallets/WalletConsole.tsx \
            docs/REAL_VENUES_AND_WALLET_PICKER.md
      - name: Commit canonical lock and source formats
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml apps/api/package.json apps/api/src/wallet-evm.ts apps/api/src/wallet-evm.test.ts apps/api/src/wallet-evm.integration.test.ts apps/api/src/wallets.ts apps/web/app/wallets/WalletKit.tsx apps/web/app/wallets/WalletConsole.tsx docs/REAL_VENUES_AND_WALLET_PICKER.md
            git commit -m "style(wallet): lock viem API dependency and format SIWE sources"
            git pull --rebase origin feat/live-venues-reown-wallet-picker
            git push origin HEAD:feat/live-venues-reown-wallet-picker
          fi
