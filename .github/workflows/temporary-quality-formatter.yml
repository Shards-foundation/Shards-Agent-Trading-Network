name: Temporary test formatter

on:
  push:
    branches: [test/quality-gates-fullstack-and-invariants]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only reported differences
        run: pnpm exec prettier --write docs/TEST_STRATEGY.md packages/risk/test/adversarial.test.ts
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/TEST_STRATEGY.md packages/risk/test/adversarial.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TEST_STRATEGY.md packages/risk/test/adversarial.test.ts
          git commit -m "style(test): apply canonical Prettier formatting"
          git push origin HEAD:test/quality-gates-fullstack-and-invariants
