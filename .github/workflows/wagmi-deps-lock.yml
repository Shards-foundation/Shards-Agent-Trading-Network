name: Wagmi dependency alignment (temporary)
on:
  push:
    branches: [feat/live-venues-reown-wallet-picker]
permissions:
  contents: write
concurrency:
  group: satns-wagmi-align
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/live-venues-reown-wallet-picker
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write package.json apps/web/package.json
      - name: Commit lock alignment
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml package.json apps/web/package.json
            git commit -m "chore(deps): regenerate Wagmi v2 lockfile"
            git pull --rebase origin feat/live-venues-reown-wallet-picker
            git push origin HEAD:feat/live-venues-reown-wallet-picker
          fi
