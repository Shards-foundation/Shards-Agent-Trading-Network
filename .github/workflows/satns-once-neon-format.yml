name: SATNS one-time Neon migration runbook formatting
on:
  push:
    branches: [feat/satns-neon-production-migration-gate]
permissions:
  contents: write
jobs:
  formatting:
    if: github.repository == 'Shards-foundation/Shards-Agent-Trading-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/satns-neon-production-migration-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format release documents
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write docs/SATNS_NEON_PRODUCTION_MIGRATION.md docs/SATNS_BACKEND_ACTIVATION.md
          pnpm exec prettier --check docs/SATNS_NEON_PRODUCTION_MIGRATION.md docs/SATNS_BACKEND_ACTIVATION.md
          git add docs/SATNS_NEON_PRODUCTION_MIGRATION.md docs/SATNS_BACKEND_ACTIVATION.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(satns): normalize Neon production migration runbook'
            git push origin HEAD:refs/heads/feat/satns-neon-production-migration-gate
          fi
