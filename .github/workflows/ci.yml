name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: satn
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: satn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satn -d satn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
        run: pnpm db:generate
      - name: Validate database schema
        env:
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
        run: pnpm db:validate
      - name: Apply migrations to ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
        run: pnpm db:migrate:deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Check formatting on changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/${GITHUB_BASE_REF}"
          else
            base="${BEFORE_SHA}"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$base...HEAD" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.mdx' '*.css' '*.scss' '*.yaml' '*.yml' '*.html' '*.vue' '*.graphql' '*.toml' | while IFS= read -r file; do
            [[ "$file" == "pnpm-lock.yaml" ]] && continue # pnpm owns lockfile formatting; frozen install validates it.
            [[ -f "$file" ]] && printf '%s\n' "$file"
          done)
          if (( ${#files[@]} == 0 )); then
            echo "No changed Prettier-supported files to check."
          else
            pnpm exec prettier --check "${files[@]}"
          fi
      - name: Check Prisma schema formatting
        run: |
          pnpm --filter @satn/database exec prisma format --schema prisma/schema.prisma
          git diff --exit-code -- packages/database/prisma/schema.prisma
      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Assert API and worker runtime artifacts
        run: |
          test -s apps/api/dist/index.js
          test -s apps/api/dist/worker-main.js
          test -s apps/api/dist/worker-queue.js
      - name: Built API and worker lifecycle smoke
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
          REDIS_URL: redis://127.0.0.1:6379
          EXECUTION_MODE: PAPER
          LIVE_EXECUTION_ENABLED: "false"
        run: pnpm --filter @satn/api exec node scripts/worker-lifecycle-smoke.mjs
      - name: Test fail-closed staging configuration preflight
        run: node --test scripts/staging-preflight.test.mjs
