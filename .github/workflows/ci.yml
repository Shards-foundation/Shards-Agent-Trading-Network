name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: satn
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: satn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satn -d satn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
        run: pnpm db:generate
      - name: Validate database schema
        env:
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
        run: pnpm db:validate
      - name: Apply migrations to ephemeral PostgreSQL
        env:
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
        run: pnpm db:migrate:deploy
      - name: Verify exact migrated schema and Prisma ledger
        env:
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
          SATNS_EXPECTED_DATABASE: satn
        run: |
          node --test apps/api/scripts/schema-attestation.test.mjs
          pnpm --filter @satn/api exec node scripts/schema-attestation.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Check formatting on changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/${GITHUB_BASE_REF}"
          else
            base="${BEFORE_SHA}"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$base...HEAD" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.mdx' '*.css' '*.scss' '*.yaml' '*.yml' '*.html' '*.vue' '*.graphql' '*.toml' | while IFS= read -r file; do
            [[ "$file" == "pnpm-lock.yaml" ]] && continue # pnpm owns lockfile formatting; frozen install validates it.
            [[ -f "$file" ]] && printf '%s\n' "$file"
          done)
          if (( ${#files[@]} == 0 )); then
            echo "No changed Prettier-supported files to check."
          else
            pnpm exec prettier --check "${files[@]}"
          fi
      - name: Validate Render staging Blueprint contract
        run: node --test scripts/render-blueprint.test.mjs
      - name: Check Prisma schema formatting
        run: |
          pnpm --filter @satn/database exec prisma format --schema prisma/schema.prisma
          git diff --exit-code -- packages/database/prisma/schema.prisma
      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Assert API and worker runtime artifacts
        run: |
          test -s apps/api/dist/index.js
          test -s apps/api/dist/worker-main.js
          test -s apps/api/dist/worker-queue.js
      - name: Built API and worker lifecycle smoke
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
          REDIS_URL: redis://127.0.0.1:6379
          EXECUTION_MODE: PAPER
          LIVE_EXECUTION_ENABLED: "false"
        run: pnpm --filter @satn/api exec node scripts/worker-lifecycle-smoke.mjs
      - name: Test fail-closed staging configuration preflight
        run: node --test scripts/staging-preflight.test.mjs
      - name: Test SATNS frontend OIDC deployment preflight
        run: node --test scripts/web-auth-preflight.test.mjs
      - name: Test guarded SATNS Neon production migration preflight
        run: node --test scripts/neon-release-preflight.test.mjs
      - name: Validate full-stack and browser smoke script syntax
        run: |
          node --check scripts/fullstack-e2e.mjs
          node --check scripts/browser-smoke.mjs
      - name: Full-stack API, Next.js SSR and Chromium browser interactions
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://satn:ci-only@127.0.0.1:5432/satn?schema=public
          REDIS_URL: redis://127.0.0.1:6379
          EXECUTION_MODE: PAPER
          LIVE_EXECUTION_ENABLED: "false"
        timeout-minutes: 6
        run: node scripts/fullstack-e2e.mjs

  staging-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test fail-closed Compose validator and secret-safe errors
        run: node --test scripts/verify-staging-compose.test.mjs
      - name: Build staging backend image
        run: |
          docker build --file deploy/Dockerfile --tag "satn-backend:ci-${GITHUB_SHA}" .
      - name: Check executable API and worker files inside image
        run: |
          docker run --rm --entrypoint node "satn-backend:ci-${GITHUB_SHA}" --check apps/api/dist/index.js
          docker run --rm --entrypoint node "satn-backend:ci-${GITHUB_SHA}" --check apps/api/dist/worker-main.js
      - name: Verify unprivileged Prisma migration tooling is available
        run: |
          docker run --rm --user node --entrypoint pnpm "satn-backend:ci-${GITHUB_SHA}" --version
      - name: Validate PAPER-only Compose topology
        env:
          SATN_BACKEND_IMAGE: satn-backend:ci-${{ github.sha }}
          DATABASE_URL: postgresql://ci:fixture@db.example.com/satn?sslmode=require
          REDIS_URL: rediss://ci:fixture@redis.example.com:6380
          WEB_ORIGIN: https://staging.example.com
          OIDC_ISSUER: https://id.example.com/
          OIDC_AUDIENCE: satn-api
          OIDC_JWKS_URL: https://id.example.com/.well-known/jwks.json
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.staging.yml config --format json | node scripts/verify-staging-compose.mjs
          if env -u OIDC_ISSUER docker compose -f deploy/compose.staging.yml config --quiet >/dev/null 2>&1; then
            echo "Expected missing OIDC configuration to fail closed."
            exit 1
          fi
