name: SATNS one-time Ed25519 auth formatting
on:
  push:
    branches: [feat/satns-strict-ed25519-oidc]
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'Shards-foundation/Shards-Agent-Trading-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/satns-strict-ed25519-oidc
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format reviewed Ed25519 implementation
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write packages/auth/src/index.ts packages/auth/test/index.test.ts apps/api/src/index.ts apps/web/app/api/auth/login/route.ts scripts/web-auth-preflight.mjs scripts/web-auth-preflight.test.mjs docs/SATNS_BACKEND_ACTIVATION.md
          pnpm exec prettier --check packages/auth/src/index.ts packages/auth/test/index.test.ts apps/api/src/index.ts apps/web/app/api/auth/login/route.ts scripts/web-auth-preflight.mjs scripts/web-auth-preflight.test.mjs docs/SATNS_BACKEND_ACTIVATION.md
          git add packages/auth/src/index.ts packages/auth/test/index.test.ts apps/api/src/index.ts apps/web/app/api/auth/login/route.ts scripts/web-auth-preflight.mjs scripts/web-auth-preflight.test.mjs docs/SATNS_BACKEND_ACTIVATION.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(auth): format Ed25519 provider compatibility'
            git push origin HEAD:refs/heads/feat/satns-strict-ed25519-oidc
          fi
