name: Wallet UI Prettier finalization

on:
  push:
    branches:
      - feat/live-venues-reown-wallet-picker

permissions:
  contents: write

concurrency:
  group: wallet-ui-format-last
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/live-venues-reown-wallet-picker
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/wallets/WalletConsole.tsx
      - name: Commit canonical formatting
        run: |
          if ! git diff --quiet -- apps/web/app/wallets/WalletConsole.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/app/wallets/WalletConsole.tsx
            git commit -m "style(wallet): run canonical Prettier on operator UI"
            git pull --rebase origin feat/live-venues-reown-wallet-picker
            git push origin HEAD:feat/live-venues-reown-wallet-picker
          fi
