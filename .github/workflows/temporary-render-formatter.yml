name: Temporary Render markdown formatter
on:
  push:
    branches:
      - ops/render-staging-deployment-blueprint

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Markdown formatting
        run: pnpm exec prettier --write docs/RENDER_STAGING.md
      - name: Commit only formatted documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/RENDER_STAGING.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(render): format staging documentation'
            git push origin HEAD:ops/render-staging-deployment-blueprint
          fi
