name: Temporary wallet Prettier diagnostics

on:
  push:
    branches:
      - feat/live-venues-reown-wallet-picker

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print authoritative WalletConsole Prettier diff (no write)
        shell: bash
        run: |
          set +e
          pnpm exec prettier apps/web/app/wallets/WalletConsole.tsx > /tmp/shards-wallet-prettier.tsx
          diff -u --label current --label prettier apps/web/app/wallets/WalletConsole.tsx /tmp/shards-wallet-prettier.tsx
          exit 0
