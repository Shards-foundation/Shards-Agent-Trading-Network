name: OCI temporary formatting diagnostic (read only)

on:
  pull_request:
    paths:
      - .github/workflows/satns-oci-readonly.yml
      - docs/OCI_ALWAYS_FREE_DEPLOYMENT.md
      - .github/workflows/satns-oci-format-diagnostics.yml

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact formatting patch without modifying git
        run: |
          pnpm exec prettier --write .github/workflows/satns-oci-readonly.yml docs/OCI_ALWAYS_FREE_DEPLOYMENT.md
          git diff -- .github/workflows/satns-oci-readonly.yml docs/OCI_ALWAYS_FREE_DEPLOYMENT.md
