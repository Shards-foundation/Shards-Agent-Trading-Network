services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: satn
      POSTGRES_PASSWORD: satn
      POSTGRES_DB: satn
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satn -d satn"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - satn-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  satn-postgres:
