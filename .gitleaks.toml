# Preserve the embedded Gitleaks rules. This exception is scoped to one
# verified false-positive prose sentence in a superseded, unmerged PR.
# It does not suppress other matches in the file, commit, or repository.
[extend]
useDefault = true

[[allowlists]]
description = "Historical PR #44 release-runbook prose, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["c096d126493777837f786405886e5ef1e8a5fcec"]
paths = ['''^docs/STAGING_RELEASE_GATES\.md$''']
regexTarget = "line"
regexes = ['''Testnet/mainnet execution remains a \*\*separate phase\*\* requiring supported venue test credentials, jurisdiction/eligibility review, isolated signer''']
